project:
  type: book
  output-dir: _book
  resources:
  - laboratorio.js
  - fuentes
  - datos
  - webr
  - webr-repo
  - plantillas
  - pdf
  - moodle
  - sw.js
book:
  title: Ciencia de la ciencia y metaciencia
  subtitle: 'Investigar sobre la investigación: medición, reproducibilidad y reforma'
  author:
  - name: Pablo Sánchez-Núñez
    orcid: 0000-0001-7845-9506
    url: https://pablosancheznunez.com
    affiliation: Universidad Carlos III de Madrid
  date: last-modified
  date-format: D [de] MMMM [de] YYYY
  language: es
  site-url: https://pablosancheznunez.com/ciencia-de-la-ciencia/
  doi: 10.5281/zenodo.24528120
  search: true
  page-navigation: true
  sidebar:
    tools:
    - icon: download
      menu:
      - text: Libro en PDF
        href: pdf/ciencia-de-la-ciencia.pdf
      - text: Libro en EPUB (lectores de libros electrónicos)
        href: pdf/ciencia-de-la-ciencia.epub
  page-footer:
    left: © 2026 [Pablo Sánchez-Núñez](https://pablosancheznunez.com) · [ORCID 0000-0001-7845-9506](https://orcid.org/0000-0001-7845-9506) · Texto bajo licencia [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es)
    right: Universidad Carlos III de Madrid · Hecho con [Quarto](https://quarto.org) y [webR](https://docs.r-wasm.org/webr/latest/)
  chapters:
  - index.qmd
  - 00-r-en-el-libro.qmd
  - part: Capítulos
    chapters:
    - 01-que-es.qmd
    - 02-medir.qmd
    - 03-reproducibilidad.qmd
    - 04-practicas.qmd
    - 05-reformas.qmd
    - 06-evaluacion.qmd
  appendices:
  - 91-guia-docente.qmd
  - 92-glosario.qmd
lang: es
crossref:
  chapters: false
filters:
- webex
- interactivos
format:
  live-html:
    theme:
      light:
      - cosmo
      - estilos.scss
      dark:
      - darkly
      - estilos-oscuro.scss
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    css: fuentes/fuentes.css
    lightbox: auto
    link-external-newwindow: true
    callout-appearance: simple
    include-in-header:
    - laboratorio.html
    include-after-body:
    - accesibilidad.html
    - progreso.html
webr:
  engine-url: webr/
  repos:
  - webr-repo
  resources:
  - datos
